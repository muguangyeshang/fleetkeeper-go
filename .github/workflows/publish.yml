name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build the CLI
        run: go build -trimpath -ldflags "-s -w" -o fleetkeeper-go.exe ./cmd/fleetkeeper-go
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: fleetkeeper-go.exe
          generate_release_notes: true
